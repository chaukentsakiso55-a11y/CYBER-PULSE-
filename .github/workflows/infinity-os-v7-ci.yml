name: Infinity OS V7 CI

on:
  push:
    paths:
      - 'infinity-os-v7/**'
      - '.github/workflows/infinity-os-v7-ci.yml'
  pull_request:
    paths:
      - 'infinity-os-v7/**'

jobs:
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: infinity-os-v7/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall .

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infinity-os-v7/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create CI Firebase config
        run: |
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"1234567890","project_id":"infinity-os-ci","storage_bucket":"infinity-os-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abcdef123456","android_client_info":{"package_name":"com.cyberpulse.infinityos"}},"api_key":[{"current_key":"AIzaSyCIPlaceholderNotForProduction123456789"}]}],"configuration_version":"1"}
          JSON
      - run: gradle :app:assembleDebug --stacktrace
