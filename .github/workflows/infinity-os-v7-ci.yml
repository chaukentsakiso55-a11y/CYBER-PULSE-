name: Cyber Pulse Website CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyber-pulse-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required files and formats
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html firebase.json sitemap.xml robots.txt; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Required website file is missing or empty"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree

          class SiteHTMLParser(HTMLParser):
              pass

          html_path = Path("index.html")
          html = html_path.read_text(encoding="utf-8")
          lowered = html.lower()

          if "<html" not in lowered or "<head" not in lowered or "<body" not in lowered:
              raise SystemExit("index.html must include html, head, and body elements")

          SiteHTMLParser().feed(html)

          with Path("firebase.json").open(encoding="utf-8") as stream:
              json.load(stream)

          ElementTree.parse("sitemap.xml")
          print("Cyber Pulse website validation passed")
          PY
