name: Study AI Android APK

on:
  pull_request:
    paths:
      - 'study-ai-android-source.zip'
      - '.github/workflows/study-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract StudyAI source
        run: unzip -q study-ai-android-source.zip -d build-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: build-src/StudyAI-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload StudyAI APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-debug-apk
          path: build-src/StudyAI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
