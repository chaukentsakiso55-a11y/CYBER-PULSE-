name: Study AI Android APK

on:
  push:
    branches:
      - study-ai-android-build
    paths:
      - 'studyai-build/**'
      - '.github/workflows/study-ai-android.yml'
  pull_request:
    paths:
      - 'studyai-build/**'
      - '.github/workflows/study-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact StudyAI source
        run: |
          rm -f /tmp/studyai.zip
          for f in studyai-build/zip_b64_*.txt; do
            base64 -d "$f" >> /tmp/studyai.zip
          done
          echo "a8e94bed305e4f74e6ccb9eeee283f98df20ca71677d4332c24528b9e63ae0cc  /tmp/studyai.zip" | sha256sum -c -
          rm -rf build-src
          mkdir -p build-src
          unzip -q /tmp/studyai.zip -d build-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: build-src/StudyAI-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s build-src/StudyAI-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload StudyAI APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Gemini-debug-apk
          path: build-src/StudyAI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
