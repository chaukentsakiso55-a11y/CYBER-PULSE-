name: Study AI Android APK

on:
  pull_request:
    paths:
      - 'StudyAI-Android/**'
      - '.github/workflows/study-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble StudyAI HTML
        run: |
          mkdir -p StudyAI-Android/app/src/main/assets
          cat StudyAI-Android/app/src/main/assets_parts/part*.html > StudyAI-Android/app/src/main/assets/study-app.html
          test "$(sha256sum StudyAI-Android/app/src/main/assets/study-app.html | awk '{print $1}')" = "6dc8a3d96ca318857c5e9a969b4552f740fa2df1a1221c5974f837401c3098a5"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: StudyAI-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s StudyAI-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload StudyAI APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-debug-apk
          path: StudyAI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
