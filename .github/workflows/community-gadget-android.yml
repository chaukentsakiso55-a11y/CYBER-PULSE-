name: Community Gadget Android

on:
  push:
    paths:
      - "community-gadget/**"
      - ".github/workflows/community-gadget-android.yml"
  pull_request:
    paths:
      - "community-gadget/**"
      - ".github/workflows/community-gadget-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test
        working-directory: community-gadget
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: community-gadget-debug-apk
          path: community-gadget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
